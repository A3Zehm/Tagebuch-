<!doctype html>
<html lang="de" data-thema="dunkel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ausbildungs-Tagebuch</title>
  <meta name="theme-color" content="#0f1216">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tagebuch">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Hier zeichnet app.js die jeweilige Ansicht hinein -->
  <main id="inhalt"></main>

  <!-- Immer sichtbarer Plus-Button -->
  <button class="plus" data-aktion="neu" aria-label="Neuer Eintrag">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
  </button>

  <!-- Navigationsleiste unten -->
  <nav class="leiste">
    <a href="#/" data-nav="start">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Start</span>
    </a>
    <a href="#/ordner" data-nav="ordner">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>
      <span>Ordner</span>
    </a>
    <a href="#/suche" data-nav="suche">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span>Suche</span>
    </a>
    <a href="#/einstellungen" data-nav="einstellungen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      <span>Mehr</span>
    </a>
  </nav>

  <!-- Eingabe für neue Einträge und zum Bearbeiten -->
  <section id="editor" class="blatt" hidden>
    <header class="blatt-kopf">
      <button class="knopf text" data-aktion="editor-abbrechen">Abbrechen</button>
      <h2 id="editor-ueberschrift">Neuer Eintrag</h2>
      <button class="knopf text stark" data-aktion="editor-speichern">Speichern</button>
    </header>
    <div class="blatt-inhalt">
      <textarea id="editor-text" class="feld" rows="7" placeholder="Was wurde dir erklärt?"></textarea>
      <button type="button" class="ordner-wahl" data-aktion="editor-ordner">
        <span class="beschriftung">Ordner</span>
        <strong id="editor-ordner-name">Eingang</strong>
        <span class="pfeil">›</span>
      </button>
      <input id="editor-titel" class="feld" placeholder="Titel (optional)" autocomplete="off">
      <input id="editor-von" class="feld" placeholder="Von wem? (optional)" autocomplete="off" autocapitalize="words">
      <div id="editor-namen" class="chips"></div>
      <button class="knopf haupt gross" data-aktion="editor-speichern">Speichern</button>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/daten.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
